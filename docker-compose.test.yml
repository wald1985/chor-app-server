services:
  postgres-test:
    image: postgres:16
    container_name: chor_app_test_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: chor_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
