name: Node.js CI with Docker Build and Deploy

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
  DOCKER_IMAGE: 'chor_app_serv'
  DEPLOY_DIR: '/opt/chor_app_serv/'
  CONTAINER_NAME: 'chor_app_serv'
  HOST_PORT: '5050'
  CONTAINER_PORT: '5050'

jobs:
  # Runs on every push and PR. Nothing below it deploys unless this passes.
  checks:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts resolves DATABASE_URL even for `prisma generate`,
      # which never connects - a placeholder is enough here.
      DATABASE_URL: 'postgresql://user:password@localhost:5432/db?schema=public'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Same major as the Dockerfile's base image - keep them in sync.
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Prisma generate
        run: npx prisma generate

      # Includes prettier via eslint-plugin-prettier.
      - name: Lint
        run: npm run lint:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: chor_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: 'postgresql://test_user:test_password@localhost:5433/chor_test?schema=public'
      JWT_SECRET: 'test-jwt-secret-key-that-is-at-least-32-chars-long-e2e'
      JWT_EXPIRES_IN: '1d'
      PASSWORD_RESET_TOKEN_TTL_MINUTES: '60'
      MAIL_HOST: 'localhost'
      MAIL_PORT: '1025'
      MAIL_USERNAME: 'test@example.com'
      MAIL_PWD: 'testpassword'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Run E2E tests
        run: npm run test:e2e

  build:
    # PRs only get the checks above - deploying needs a push to main.
    if: github.event_name == 'push'
    needs: [checks, e2e]
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Получение кода из репозитория
      - uses: actions/checkout@v4

      # Шаг 2: Установка Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Шаг 3: Сборка Docker-образа
      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE:latest .

      # Шаг 4: Сохранение Docker-образа в tar-файл
      - name: Save Docker image
        run: |
          docker save $DOCKER_IMAGE:latest -o $DOCKER_IMAGE.tar

      # Шаг 5: Настройка SSH-агента и добавление известного хоста
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server host key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # Шаг 6: Копирование файлов на удаленный сервер
      - name: Copy files to remote server
        run: |
          # Создаем директорию перед копированием
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "mkdir -p $DEPLOY_DIR"

          # Копируем образ и docker-compose
          scp $DOCKER_IMAGE.tar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:$DEPLOY_DIR
          scp docker-compose.yml ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:$DEPLOY_DIR

  deploy-to-server:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Шаг 1: Настройка SSH-агента
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server host key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # Шаг 2: Деплой. `set -e` - любая упавшая команда валит весь шаг.
      # Миграции применяются новым образом ДО замены контейнера: если
      # `prisma migrate deploy` упадет, старый контейнер продолжит работать,
      # а job станет красным.
      # `docker compose up -d` возвращает 0, даже если приложение сразу
      # падает (например, не хватает ключа в .env) - поэтому через 15 с
      # проверяем, что контейнер работает и ни разу не перезапускался.
      - name: Prepare environment and deploy
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            set -e
            cd $DEPLOY_DIR

            mkdir -p data backups_history
            chmod 777 data backups_history

            docker load -i $DOCKER_IMAGE.tar

            docker compose run --rm -T server npx prisma migrate deploy

            docker compose down
            docker compose up -d

            sleep 15
            docker inspect -f '{{.State.Status}} {{.RestartCount}}' $CONTAINER_NAME | grep -qx 'running 0' || { docker logs --tail 50 $CONTAINER_NAME; exit 1; }

            rm $DOCKER_IMAGE.tar
            docker image prune -f
          "
